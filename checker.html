<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تبيّن — فاحص بنود عقود الهوية البصرية</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7fdf9;
      --primary: #065f46;
      --primary-hover: #047857;
      --border: #34d399;
      --soft-green: #ecfdf5;
      --text: #0f291e;
      --muted: #4b6358;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }
    header {
      background: var(--primary);
      color: #ffffff;
      padding: 18px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #d1fae5;
    }
    main {
      max-width: 820px;
      margin: 28px auto;
      padding: 0 16px 40px;
    }
    .card {
      background: var(--bg);
      border: 1.5px solid #a7f3d0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1.5px solid var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--soft-green);
      color: var(--primary);
      border: 1.5px solid var(--border);
    }
    .result-box {
      white-space: pre-line;
      background: var(--surface);
      border: 1.5px solid #a7f3d0;
      border-radius: 10px;
      padding: 16px;
      min-height: 150px;
      color: var(--text);
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>تبيّن — فاحص بنود عقود الهوية البصرية</h1>
    <p>فحص أولي لبنود عقود الهوية البصرية وربطها بالأنظمة السعودية ذات الصلة</p>
  </header>

  <main>
    <div class="card">
      <div class="status" id="dbStatus">جاري فحص ملفات الأنظمة في المستودع...</div>
      <label for="clauseInput">أدخلي بند العقد هنا</label>
      <textarea id="clauseInput" placeholder="اكتبي هنا بند العقد للمعاينة والفحص..."></textarea>
      <div class="actions">
        <button class="btn-primary" id="submitBtn" type="button">Submit</button>
        <button class="btn-secondary" id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div class="card">
      <label>تحليل «تبيّن» والمرجع النظامي</label>
      <div class="result-box" id="resultBox">ستظهر نتيجة الفحص هنا بعد الضغط على Submit.</div>
    </div>
  </main>

  <script>
    const JSONL_FILES = [
      "civil_transactions_articles.jsonl",
      "commercial_transactions_articles.jsonl",
      "companies_articles.jsonl",
      "copyright_articles.jsonl",
      "ecommerce_articles.jsonl"
    ];

    let articles = [];

    async function loadArticles() {
      for (const file of JSONL_FILES) {
        try {
          const res = await fetch(file);
          if (!res.ok) continue;
          const raw = await res.text();
          const lines = raw.split(/\r?\n/).filter(l => l.trim());
          for (const line of lines) {
            try {
              const d = JSON.parse(line);
              articles.push({
                law: d.law_name || d.source_section || file,
                heading: d.article_heading || d.article_number || "مادة نظامية",
                body: (d.article_text || d.text || "").trim()
              });
            } catch (_) {}
          }
        } catch (_) {}
      }
      const statusEl = document.getElementById("dbStatus");
      statusEl.textContent = articles.length > 0
        ? `تم تحميل ${articles.length} مادة نظامية للمطابقة المرجعية.`
        : "يعمل الفاحص بقواعد التصنيف الجاهزة.";
    }

    function hasAny(text, list) {
      return list.some(k => text.includes(k));
    }

    function analyzeClause(text) {
      const t = (text || "").trim();
      if (!t) return "اكتبي بند العقد أولاً.";

      let kind, law, risk, protect;

      if (hasAny(t, ["غير محدودة", "لا نهائية", "مفتوحة", "بلا قيود", "غير محددة"])) {
        kind = "تعديلات غير محدودة أو مفتوحة (يحتاج مراجعة)";
        law = "نظام المعاملات المدنية السعودي";
        risk = "ترك التعديلات بلا سقف أو عدد جولات يرهق المصمم ويطيل التنفيذ.";
        protect = "حددي عدد جولات التعديل لكل مرحلة، واذكري أن أي تعديل إضافي برسوم مستقلة.";
      } else if (hasAny(t, ["ملحق", "مرفق", "جدول", "كشف"]) && hasAny(t, ["عدم إرفاقه", "غير مرفق", "المرفق"])) {
        kind = "إحالة لملحق أو مرفق (يحتاج مراجعة)";
        law = "نظام المعاملات المدنية السعودي / نظام التجارة الإلكترونية";
        risk = "الاعتماد على مرفق أو ملحق غير مرفق وقت التوقيع يخلق غموضاً في الالتزامات.";
        protect = "تأكدي من إرفاق الملحق واعتماده من الطرفين قبل التوقيع.";
      } else if (hasAny(t, ["ملكية فكرية", "ملفات المصدر", "المصدر المفتوحة", "صيغ"])) {
        const hasClearTerms = (t.includes("بعد سداد") || t.includes("سداد كامل")) &&
          hasAny(t.toUpperCase(), ["PDF", "PNG", "SVG", "AI", "PSD"]);
        if (hasClearTerms) {
          kind = "بند واضح ومحدد في التسليم والملكية (صريح)";
          law = "نظام حماية حقوق المؤلف السعودي / نظام المعاملات المدنية السعودي";
          risk = "البند يحدد الصيغ وملفات المصدر ويربطها بسداد المستحقات بشكل واضح.";
          protect = "تأكدي من تطابقه مع بقية بنود العقد والملاحق النهائية.";
        } else {
          kind = "الملكية الفكرية وملفات المصدر (يحتاج مراجعة)";
          law = "نظام حماية حقوق المؤلف السعودي / نظام المعاملات المدنية السعودي";
          risk = "غموض انتقال الحقوق أو حجب ملفات المصدر المفتوحة يسبب نزاعاً لاحقاً.";
          protect = "وضحي متى تنتقل الحقوق وما هي الصيغ وملفات المصدر التي تُسلّم.";
        }
      } else if (hasAny(t, ["دفعة", "دفعات", "سداد", "مقدماً", "%", "ريال"])) {
        kind = "الدفعات المالية وآلية التسليم";
        law = "نظام المعاملات المدنية السعودي";
        risk = "أي غموض في مواعيد السداد أو آلية اعتماد التسليم قد يؤخر المستحقات.";
        protect = "حددي النسب والمواعيد ومدة الاعتراض أو الاعتماد بعد التسليم.";
      } else {
        kind = "بند يحتاج مراجعة سياقية";
        law = "نظام المعاملات المدنية السعودي";
        risk = "راجعي وضوح المدد والالتزامات والملحقات المرتبطة بالبند.";
        protect = "صيغي الالتزام والمدة بشكل صريح ومكتوب.";
      }

      const words = [...new Set((t.match(/[\u0600-\u06FF]{3,}/g) || []))];
      let bestArt = null;
      let bestHits = 0;

      for (const art of articles) {
        const hay = `${art.heading} ${art.body}`;
        const hits = words.reduce((acc, w) => acc + (hay.includes(w) ? 1 : 0), 0);
        if (hits > bestHits) {
          bestHits = hits;
          bestArt = art;
        }
      }

      let refBlock = "";
      if (bestArt && bestHits > 0) {
        const snippet = bestArt.body.replace(/\s+/g, " ").slice(0, 220);
        refBlock = `\n\nأقرب مادة في ملفات الأنظمة (${bestArt.law} — ${bestArt.heading}):\n${snippet}...`;
      }

      return (
        `التصنيف: ${kind}\n\n` +
        `النظام السعودي ذو الصلة: ${law}\n\n` +
        `أين تكمن النقطة الحساسة؟\n${risk}\n\n` +
        `كيف تحفظ حقك؟\n${protect}` +
        `${refBlock}\n\n` +
        `تنويه: أداة توجيه أولي وليست استشارة قانونية معتمدة.`
      );
    }

    document.getElementById("submitBtn").addEventListener("click", () => {
      const val = document.getElementById("clauseInput").value;
      document.getElementById("resultBox").textContent = analyzeClause(val);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("clauseInput").value = "";
      document.getElementById("resultBox").textContent = "ستظهر نتيجة الفحص هنا بعد الضغط على Submit.";
    });

    loadArticles();
  </script>
</body>
</html>
